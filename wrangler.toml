name = "komiknetwork"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
preview_urls = true # <-- TAMBAHKAN BARIS INI

# =====================================================================
# PENGATURAN OBSERVABILITY (Sesuai permintaan dashboard Cloudflare)
# =====================================================================
[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

# =====================================================================
# (OPSIONAL) UNTUK DOMAIN KUSTOM (komiknet.site)
# Hapus tanda pagar (#) di bawah ini JIKA domain komiknet.site 
# sudah dimasukkan ke Cloudflare dan Nameserver-nya sudah aktif.
# =====================================================================
# routes = [
#   { pattern = "komiknet.site", custom_domain = true },
#   { pattern = "www.komiknet.site", custom_domain = true }
# ]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[browser]
binding = "MYBROWSER"