name = "komiknetwork"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

workers_dev = true
preview_urls = true

# =====================================================================
# OBSERVABILITY
# =====================================================================
[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

# =====================================================================
# DOMAIN KUSTOM (komiknet.site)
# Hapus tanda pagar (#) di bawah ini HANYA JIKA status komiknet.site di
# Cloudflare sudah Active. Jangan dipakai bersamaan dengan Add Domain
# lewat dashboard, pilih salah satu.
# =====================================================================
# routes = [
#   { pattern = "komiknet.site", custom_domain = true },
#   { pattern = "www.komiknet.site", custom_domain = true }
# ]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[browser]
binding = "MYBROWSER"